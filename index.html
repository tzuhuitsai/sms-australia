let ci=0,di=0;
function dotBg(tp,ac,bc){return tp==='fd'?'#d1fae5':tp==='mv'?'#f0f0eb':bc;}
function dotColor(tp,ac){return tp==='fd'?'#047857':tp==='mv'?'#888':ac;}
function dotLabel(tp){return tp==='fd'?'食':tp==='mv'?'行':'看';}

function render(){
  const city=C[ci];
  document.querySelectorAll('.city-btn').forEach((b,i)=>{
    b.style.background=i===ci?city.bc:'#fff';
    b.style.borderColor=i===ci?city.ac:'#ddd';
    b.style.color=i===ci?city.ac:'#444';
    b.style.fontWeight=i===ci?'600':'400';
  });
  document.getElementById('ccard').innerHTML=`
    <div class="city-card-stripe" style="background:${city.ac}"></div>
    <div class="city-card-body" style="background:${city.bc}">
      <div class="city-card-title" style="color:${city.ac}">${city.name} · ${city.dates}（${city.nights} 晚）</div>
      <div class="city-card-info">
        <b>飯店</b>：${city.hotel}<br>
        <b>入境</b>：${city.fin}<br>
        <b>出境</b>：${city.fout}
      </div>
    </div>`;
  const dtabs=document.getElementById('dtabs');
  dtabs.innerHTML=city.days.map((d,i)=>`<button class="day-btn" data-di="${i}" style="background:${i===di?city.ac:'#fff'};color:${i===di?city.bc:'#666'};border-color:${i===di?city.ac:'#ddd'};font-weight:${i===di?'600':'400'}">${d.d}</button>`).join('');
  dtabs.querySelectorAll('.day-btn').forEach(b=>b.addEventListener('click',()=>{di=+b.dataset.di;render();}));
  const day=city.days[di];
  const rows=day.items.map((item,idx)=>`
    <div class="tl-row">
      <div class="tl-time">${item.t}</div>
      <div class="tl-col">
        <div class="tl-dot" style="background:${dotBg(item.tp,city.ac,city.bc)};color:${dotColor(item.tp,city.ac)}">${dotLabel(item.tp)}</div>
        ${idx<day.items.length-1?'<div class="tl-line"></div>':''}
      </div>
      <div class="tl-text" style="background:${item.tp==='fd'?'#f0fdf4':item.tp==='mv'?'#f5f5f0':city.bc}">${item.x}</div>
    </div>`).join('');
  document.getElementById('dpanel').innerHTML=`
    <div class="day-title-sub">${day.d}</div>
    <div class="day-title">${day.title}</div>
    ${rows}
    <div class="tip"><b style="color:#92400e">小提醒：</b><span style="color:#78350f">${day.tip}</span></div>`;
  document.querySelector('.legend-at .legend-dot').style.background=city.bc;
  document.querySelector('.legend-at .legend-dot').style.color=city.ac;
}

const ctabs=document.getElementById('ctabs');
C.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='city-btn';
  b.innerHTML=`${c.name} <span style="font-size:11px;opacity:.65">${c.dates}</span>`;
  b.addEventListener('click',()=>{ci=i;di=0;render();});
  ctabs.appendChild(b);
});
render();
</script>
